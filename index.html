<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novel AI 生图工具</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 20px;
    }
    .sidebar {
      background: #242424;
      border-radius: 8px;
      padding: 20px;
      height: fit-content;
      position: sticky;
      top: 20px;
    }
    .sidebar h2 {
      font-size: 14px;
      margin-bottom: 15px;
      color: #999;
      text-transform: uppercase;
      font-weight: 600;
    }
    .preset-item {
      padding: 12px 10px;
      margin-bottom: 8px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 14px;
    }
    .preset-item:hover {
      border-color: #555;
      background: #2a2a2a;
    }
    .preset-item.active {
      border-color: #0099ff;
      background: #003366;
    }
    .preset-item strong { display: block; }
    .preset-item small { color: #888; font-size: 12px; }
    .btn-add-preset {
      width: 100%;
      padding: 10px;
      background: #0099ff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 15px;
    }
    .btn-add-preset:hover { background: #0077cc; }

    .main-content {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .panel {
      background: #242424;
      border-radius: 8px;
      padding: 20px;
      border: 1px solid #333;
    }
    .panel h1 {
      font-size: 18px;
      margin-bottom: 15px;
      color: #fff;
    }

    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: #ccc;
      font-weight: 500;
    }
    textarea, select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #e0e0e0;
      font-family: inherit;
      font-size: 13px;
    }
    textarea:focus, select:focus, input:focus {
      outline: none;
      border-color: #0099ff;
    }
    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 15px;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background: #0099ff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      margin-top: 10px;
    }
    .btn-primary:hover { background: #0077cc; }
    .btn-primary:disabled {
      background: #333;
      cursor: not-allowed;
      color: #888;
    }

    .preview-box {
      aspect-ratio: 2 / 3;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #666;
      position: relative;
      overflow: hidden;
    }
    .preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .preview-loading {
      position: absolute;
      width: 40px;
      height: 40px;
      border: 3px solid #333;
      border-top: 3px solid #0099ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .queue-item {
      padding: 12px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .queue-item.processing { border-color: #0099ff; }
    .queue-item.done { border-color: #00aa00; }
    .queue-status {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }

    .message {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #333;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 13px;
      animation: slideIn 0.3s ease-out;
    }
    @keyframes slideIn {
      from { transform: translateX(400px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }
    .gallery-item {
      aspect-ratio: 2 / 3;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .gallery-item-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.8);
      padding: 8px;
      font-size: 11px;
      color: #aaa;
      max-height: 60%;
      overflow: hidden;
    }

    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 15px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      background: #1a1a1a;
      border: 1px solid #333;
      color: #999;
      cursor: pointer;
      font-size: 13px;
      border-radius: 6px 0 0 6px;
    }
    .tab-btn:nth-child(n+2) { border-radius: 0; }
    .tab-btn:last-child { border-radius: 0 6px 6px 0; }
    .tab-btn.active {
      background: #0099ff;
      color: white;
      border-color: #0099ff;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>
  <div class="container">
    <!-- 侧边栏：画师预设 -->
    <div class="sidebar">
      <h2>画师预设</h2>
      <button class="btn-add-preset" onclick="showPresetForm()">+ 新建预设</button>
      <div id="presetList"></div>
    </div>

    <!-- 主内容 -->
    <div class="main-content">
      <!-- 标签页 -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('generate')">生成</button>
        <button class="tab-btn" onclick="switchTab('queue')">队列</button>
        <button class="tab-btn" onclick="switchTab('gallery')">画廊</button>
      </div>

      <!-- 生成面板 -->
      <div id="tab-generate" class="tab-content active">
        <div class="panel">
          <h1>文本生图</h1>

          <div class="form-group">
            <label>选择画师预设</label>
            <select id="artistSelect" onchange="applyPreset()">
              <option value="">选择预设...</option>
            </select>
          </div>

          <div class="form-group">
            <label>提示词</label>
            <textarea id="prompt" placeholder="描述你想要的图像..."></textarea>
          </div>

          <div class="form-group">
            <label>负面提示词</label>
            <textarea id="negativePrompt" placeholder="描述你不想要的..."></textarea>
          </div>

          <div class="grid-3">
            <div class="form-group">
              <label>模型</label>
              <select id="model">
                <option value="nai-diffusion-4">NAI Diffusion 4</option>
                <option value="nai-diffusion-4-5">NAI Diffusion 4.5</option>
                <option value="nai-diffusion-3">NAI Diffusion 3</option>
              </select>
            </div>
            <div class="form-group">
              <label>画幅</label>
              <select id="resolution">
                <option value="512x768">竖幅 512x768</option>
                <option value="640x960">竖幅 640x960</option>
                <option value="768x512">横幅 768x512</option>
                <option value="960x640">横幅 960x640</option>
                <option value="512x512">方形 512x512</option>
              </select>
            </div>
            <div class="form-group">
              <label>采样步数</label>
              <input type="number" id="steps" value="28" min="10" max="50">
            </div>
          </div>

          <div class="grid-3">
            <div class="form-group">
              <label>引导强度</label>
              <input type="number" id="guidance" value="7" min="1" max="20" step="0.5">
            </div>
            <div class="form-group">
              <label>种子</label>
              <input type="number" id="seed" placeholder="留空为随机">
            </div>
            <div class="form-group">
              <label>生成数量</label>
              <input type="number" id="batchSize" value="1" min="1" max="4">
            </div>
          </div>

          <button class="btn-primary" id="generateBtn" onclick="generate()">生成</button>
        </div>

        <div class="panel">
          <h1>预览</h1>
          <div class="preview-box" id="preview">
            <div>等待生成...</div>
          </div>
        </div>
      </div>

      <!-- 队列面板 -->
      <div id="tab-queue" class="tab-content">
        <div class="panel">
          <h1>生成队列</h1>
          <div id="queueList"></div>
        </div>
      </div>

      <!-- 画廊面板 -->
      <div id="tab-gallery" class="tab-content">
        <div class="panel">
          <h1>生成历史</h1>
          <div class="gallery-grid" id="galleryGrid"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
